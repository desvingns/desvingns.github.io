<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ground Truth Privacy Policy / Политика конфиденциальности">
  <link rel="canonical" href="https://desvingns.github.io/ground-truth/privacy-policy/">
  <title>Ground Truth Privacy Policy</title>
  <script>
    // Russian-language browsers go straight to the Russian policy; everyone else to English.
    // The visible links below keep the page usable without JavaScript.
    var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    location.replace(/^ru/i.test(languages[0] || "") ? "ru/" : "en/");
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { max-width: 52rem; margin: 0 auto; padding: 2rem 1rem 4rem; }

</head>

  </ul>
</body>
</html>
